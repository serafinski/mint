[project]
name = "justintimemas"
version = "0.1.0"
description = "JIT Capability Synthesis for Self-Developing Multi-Agent Systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.0",
    "deepagents>=0.4.12",
    "duckdb>=1.4.4",
    "langchain-openai>=1.1.13",
    "langfuse>=3.14.1",
    "langgraph>=1.0.8",
    "matplotlib>=3.10.8",
    "mcp>=1.26.0",
    "numpy>=2.4.2",
    "openpyxl>=3.1.5",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "rich>=13.0.0",
    "scipy>=1.17.1",
    "typer>=0.15.0",
]

[project.scripts]
mint = "src.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: tests that use external services (Docker, MCP servers, databases)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]

[project]
name = "mint"
version = "0.1.0"
description = "Just-in-Time Capability Synthesis, Verification, and Evolutionary Optimization in Self-Evolving Multi-Agent Systems Backed by Large Language Models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.0",
    "deepagents>=0.4.12",
    "duckdb>=1.4.4",
    "langchain-openai>=1.1.13",
    "langfuse>=3.14.1",
    "langgraph>=1.0.8",
    "mcp>=1.28.1",
    "numpy>=2.4.2",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "tiktoken>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: tests that use external services (Docker, MCP servers, databases)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]
eval = [
    "openpyxl>=3.1.5",
]
analysis = [
    "matplotlib>=3.10.8",
]
